<svg xmlns="http://www.w3.org/2000/svg" width="488" height="202" viewBox="0 0 488 202" role="img" aria-labelledby="t"><title id="t">Miru-Image-Classifier: Convolutional neural network in PyTorch, trained from scratch on Tiny ImageNet to roughly 71% accuracy. Uses .NET and AWS. Written in Python.</title><style>@font-face{font-family:'plex-mono';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'plex-mono-bold';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'plex-serif';src:url(data:font/woff;base64,) format('woff');}.mono{font-family:'plex-mono',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.monob{font-family:'plex-mono-bold',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.serif{font-family:'plex-serif',Georgia, 'Times New Roman', serif;}</style><path d="M14.5,0.5 H469.5 A6,6 0 0 1 475.5,6.5 V195.5 A6,6 0 0 1 469.5,201.5 H6.5 A6,6 0 0 1 0.5,195.5 V14.5 Z" fill="#1f1e1d" stroke="#34332f"/><text class="monob" x="26.00" y="50.00" font-size="19" fill="#d97757" letter-spacing="-.3">Miru-Image-Classifier</text><text class="serif" x="26.00" y="84.00" font-size="16" fill="#faf9f5">Convolutional neural network in PyTorch, trained from</text><text class="serif" x="26.00" y="108.00" font-size="16" fill="#faf9f5">scratch on Tiny ImageNet to roughly 71% accuracy.</text><text class="serif" x="26.00" y="132.00" font-size="16" fill="#faf9f5">Uses .NET and AWS.</text><rect x="26" y="166.5" width="9" height="9" rx="1" fill="#6a9bcc"/><text class="mono" x="43.00" y="176.00" font-size="13.5" fill="#b0aea5">Python</text></svg>