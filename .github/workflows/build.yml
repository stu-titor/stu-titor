# Rebuilds the profile images with fresh language stats from your repos.
# Runs on every push, every Monday, and on demand from the Actions tab.
name: Build profile

on:
  push:
    branches: [main, master]
    paths-ignore: ["assets/**", "README.md", "languages.json"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          [ -f languages.json ] && git add languages.json
          git diff --cached --quiet || (git commit -m "Refresh language stats" && git push)
